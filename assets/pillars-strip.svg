<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 184" width="1200" height="184" role="img" aria-labelledby="ou-pillars-title">
  <title id="ou-pillars-title">openUrain 核心理念：真实需求、稳定可靠、简单易用、开放协作</title>
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eaf3ff"/>
    </linearGradient>
    <linearGradient id="pcard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#f2f7ff" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="pshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102c72" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="184" rx="20" fill="url(#pbg)" stroke="#1546c8" stroke-opacity="0.16" stroke-width="1.2"/>

  <!-- Pillar 1: 真实需求 -->
  <g transform="translate(20, 20)" filter="url(#pshadow)">
    <rect width="278" height="144" rx="16" fill="url(#pcard)" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="20" y="20" width="42" height="42" rx="12" fill="#e6f0ff" stroke="#ffffff"/>
    <g transform="translate(29, 29)" fill="none" stroke="#1546c8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5" fill="#2d9cff" fill-opacity="0.14"/>
      <circle cx="12" cy="12" r="4.5"/>
      <circle cx="12" cy="12" r="1.4" fill="#1546c8" stroke="none"/>
    </g>
    <text x="74" y="46" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#1546c8" opacity="0.6">01</text>
    <text x="20" y="88" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#0b1733">真实需求</text>
    <text x="20" y="110" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#425470">从实际工作痛点出发，认真</text>
    <text x="20" y="128" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#425470">听取并回应每一次用户反馈。</text>
  </g>

  <!-- Pillar 2: 稳定可靠 -->
  <g transform="translate(314, 20)" filter="url(#pshadow)">
    <rect width="278" height="144" rx="16" fill="url(#pcard)" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="20" y="20" width="42" height="42" rx="12" fill="#e6f0ff" stroke="#ffffff"/>
    <g transform="translate(29, 29)" fill="none" stroke="#1546c8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5 19 6.5v5.5c0 4.2-3 7.4-7 8.5-4-1.1-7-4.3-7-8.5V6.5l7-3Z" fill="#2d9cff" fill-opacity="0.14"/>
      <path d="m9 12 2 2 4-4"/>
    </g>
    <text x="74" y="46" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#1546c8" opacity="0.6">02</text>
    <text x="20" y="88" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#0b1733">稳定可靠</text>
    <text x="20" y="110" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#425470">重视软件质量、清晰的数据</text>
    <text x="20" y="128" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#425470">安全边界与长期持续维护。</text>
  </g>

  <!-- Pillar 3: 简单易用 -->
  <g transform="translate(608, 20)" filter="url(#pshadow)">
    <rect width="278" height="144" rx="16" fill="url(#pcard)" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="20" y="20" width="42" height="42" rx="12" fill="#e6f0ff" stroke="#ffffff"/>
    <g transform="translate(29, 29)" fill="none" stroke="#1546c8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4.5" width="16" height="15" rx="3" fill="#2d9cff" fill-opacity="0.14"/>
      <path d="M8 9.5h8M8 13h5.5M8 16.5h3.5"/>
    </g>
    <text x="74" y="46" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#1546c8" opacity="0.6">03</text>
    <text x="20" y="88" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#0b1733">简单易用</text>
    <text x="20" y="110" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#425470">降低上手门槛，让每一处交</text>
    <text x="20" y="128" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#425470">互细节服务于真实的日常任务。</text>
  </g>

  <!-- Pillar 4: 开放协作 -->
  <g transform="translate(902, 20)" filter="url(#pshadow)">
    <rect width="278" height="144" rx="16" fill="url(#pcard)" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="20" y="20" width="42" height="42" rx="12" fill="#e6f0ff" stroke="#ffffff"/>
    <g transform="translate(29, 29)" fill="none" stroke="#1546c8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 3.5 19.5 7.75 19.5 16.25 12 20.5 4.5 16.25 4.5 7.75" fill="#2d9cff" fill-opacity="0.14"/>
      <path d="M12 8.5v7M8.5 12h7"/>
    </g>
    <text x="74" y="46" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#1546c8" opacity="0.6">04</text>
    <text x="20" y="88" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#0b1733">开放协作</text>
    <text x="20" y="110" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#425470">公开路线与工程规范，与社</text>
    <text x="20" y="128" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#425470">区共建者一同打磨实用软件。</text>
  </g>
</svg>
